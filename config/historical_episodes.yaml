version: v1
episodes:
  - id: tightening_2018q4
    name: 2018 Q4 tightening and liquidity stress
    event_start: 2018-10-01
    event_end: 2018-12-24
    lead_window_days: 30
    required_features:
      - treasury_real_yield_10y
      - dealer_balance_sheet_stress
      - credit_spread_stress
    min_peak_stress: L2
    expected_state_peaks:
      B: 0.60
    note: "Evaluation hypothesis, not a claim of successful detection."

  - id: repo_2019_09
    name: September 2019 repo spike
    event_start: 2019-09-16
    event_end: 2019-09-20
    lead_window_days: 10
    required_features:
      - repo_rate_stress
      - dealer_balance_sheet_stress
    min_peak_stress: L2
    expected_state_peaks:
      B: 0.65
    note: "Funding-channel validation target."

  - id: treasury_2020_03
    name: March 2020 Treasury-market dysfunction
    event_start: 2020-03-09
    event_end: 2020-03-23
    lead_window_days: 15
    required_features:
      - treasury_market_depth
      - repo_funding_stress
      - dealer_intermediation_stress
    min_peak_stress: L3
    expected_state_peaks:
      B: 0.75
    note: "L4 additionally requires verified controller intervention and forced deleveraging."

  - id: uk_ldi_2022
    name: 2022 UK LDI stress
    event_start: 2022-09-23
    event_end: 2022-10-14
    lead_window_days: 10
    required_features:
      - uk_gilt_liquidity
      - uk_ldI_margin_stress
    min_peak_stress: L3
    expected_state_peaks:
      B: 0.65
    note: "Expected to remain PENDING_DATA until UK-specific gilt/LDI sources are added."

  - id: svb_2023_03
    name: March 2023 regional-bank stress
    event_start: 2023-03-08
    event_end: 2023-03-17
    lead_window_days: 20
    required_features:
      - bank_unrealized_loss_stress
      - deposit_funding_stress
    min_peak_stress: L2
    expected_state_peaks:
      B: 0.60
    note: "Bank balance-sheet module is required before this episode can be scored."

  - id: carry_2024_08
    name: August 2024 cross-market carry unwind
    event_start: 2024-08-01
    event_end: 2024-08-09
    lead_window_days: 10
    required_features:
      - jpy_cross_asset_deleveraging
      - volatility_liquidity_stress
    min_peak_stress: L2
    expected_state_peaks:
      B: 0.60
    note: "Cross-market carry feature family is not yet part of the open-source core."
