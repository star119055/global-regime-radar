version: shadow-v2
decision_time:
  timezone: Asia/Singapore
  local_time: "08:30"
  github_cron_utc: "30 0 * * *"

readiness:
  minimum_state_coverage: 0.40
  required_states: [A, B, C1, C2, C3, D]
  diagnostic_when_pending: true
  pending_is_promotion_eligible: false

engines:
  baseline0:
    enabled: true
  baseline1:
    enabled: true
    persist_state: true
  ukf:
    enabled: true
    status: candidate
    persist_state: true

ledger:
  branch: shadow-ledger
  append_only_runs: true
  latest_state_path: state/latest.json
  run_path: "runs/{date}/{run_id}"
  retain_live_evidence: true

promotion:
  automatic: false
  minimum_shadow_days: 60
  compare:
    - state_stability
    - episode_lead_time
    - false_alarm_rate
    - missing_data_robustness

outcomes:
  horizons_days: [5, 20, 60]
