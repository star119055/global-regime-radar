version: live-v5
lookback_days: 180

no_key_sources:
  - nyfed_sofr
  - nyfed_repo_operations
  - treasury_fiscal_auctions
  - treasury_real_yield_curve
  - noaa_psl_oni
  - bls_transformer_industry_ppi
  - bls_switchgear_industry_ppi

curated_annual_sources:
  - lbnl_queued_up

key_required_not_enabled_by_default:
  - eia_api_v2
  - usda_fas_psd

research_context_sources:
  - census_btos_ai_supplement_2026

state_mapping:
  A:
    - apcr_did: pending
    - llier: pending
    - geoi: pending
  B:
    - repo_usage_stress
    - sofr_dispersion_stress
    - auction_quality_stress
    - auction_dealer_takedown_stress
    - dealer_balance_sheet: pending
  C1: pending
  C2: pending
  C3:
    - capex_deflator
    - interconnection_execution
    - transformer_lead_time: pending
  D:
    - real_yield_repression
    - issuance_duration
    - regulatory_intervention: pending
    - asset_gap: pending

low_frequency_evidence:
  interconnection_execution:
    source: lbnl_queued_up
    observation_frequency: annual
    base_measurement_variance: 0.04
    freshness_half_life_days: 365
    semantics: draft_or_executed_ia_share_of_active_generation_plus_storage_queue
    transport: versioned_curated_snapshot_registry
    registry: config/lbnl_queued_up_snapshots.yaml

gap_priority:
  A: CRITICAL
  B: MEDIUM
  C1: HIGH
  C2: HIGH
  C3: CRITICAL
  D: MEDIUM

discipline:
  noaa_oni_is_exogenous: true
  generic_productivity_is_not_apcr: true
  btos_research_context_is_not_apcr_did: true
  lbnl_generation_queue_is_not_llier: true
  dealer_takedown_is_not_dealer_balance_sheet: true
  equipment_ppi_is_not_transformer_lead_time: true
  lbnl_ia_share_is_not_cod: true
  annual_queue_snapshot_is_not_daily_data: true
  issuance_duration_is_partial_tids_proxy: true
  missing_is_not_zero: true
