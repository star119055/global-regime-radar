version: live-v3
lookback_days: 180

no_key_sources:
  - nyfed_sofr
  - nyfed_repo_operations
  - treasury_fiscal_auctions
  - treasury_real_yield_curve
  - noaa_psl_oni
  - bls_transformer_industry_ppi
  - bls_switchgear_industry_ppi

key_required_not_enabled_by_default:
  - eia_api_v2
  - usda_fas_psd

state_mapping:
  A: pending
  B:
    - repo_usage_stress
    - sofr_dispersion_stress
    - auction_quality_stress
    - auction_dealer_takedown_stress
    - dealer_balance_sheet: pending
  C1: pending
  C2: pending
  C3:
    - capex_deflator
    - transformer_lead_time: pending
    - interconnection_execution: pending
  D:
    - real_yield_repression
    - issuance_duration
    - regulatory_intervention: pending
    - asset_gap: pending

gap_priority:
  A: CRITICAL
  B: MEDIUM
  C1: HIGH
  C2: HIGH
  C3: CRITICAL
  D: MEDIUM

discipline:
  noaa_oni_is_exogenous: true
  generic_productivity_is_not_apcr: true
  dealer_takedown_is_not_dealer_balance_sheet: true
  equipment_ppi_is_not_transformer_lead_time: true
  issuance_duration_is_partial_tids_proxy: true
  missing_is_not_zero: true
