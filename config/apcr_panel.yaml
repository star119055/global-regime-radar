version: apcr-panel-v1
state: A
indicator_key: apcr_did
authoritative_candidate: true
live_state_enabled: false

identification:
  specification: baseline-treatment-continuous-did
  equation: "Productivity_it = alpha_i + lambda_t + beta * BaselineAIIntensity_i * Post_t + error_it"
  reported_quantity: interaction_coefficient_beta
  causal_claim_allowed: false
  treatment_is_time_varying: false

treatment:
  source_id: census_btos_ai
  publisher: U.S. Census Bureau
  entity_level: naics2
  strata: sector
  measure: current_ai_use_share
  baseline_window:
    period_ids: [31, 32, 33, 34, 35, 36]
    start: 2023-09-11T00:00:00Z
    end: 2023-12-03T23:59:59Z
    aggregation: simple_mean
    require_all_periods_per_entity: true
  strata_scope:
    geography: national
    entity: naics2
    employee_size: total_only
    raw_filter:
      STATE: null
      MSA: null
      EMPSIZE: null
  accepted_measurement_regime: producing_goods_or_services
  standard_error_weighting: forbidden_for_baseline_point_estimate
  excluded_measurement_regimes:
    - any_business_function
  known_break:
    effective_date: 2025-11-17T00:00:00Z
    reason: Census changed the core AI wording and created a new time series because of a level shift.

outcome:
  source_id: bls_major_industry_productivity
  publisher: U.S. Bureau of Labor Statistics
  database: Major Industry Productivity
  entity_level: naics2_major_industry
  frequency: annual
  live_research_transport: bls_public_api_v2
  live_research_candidate_years: [2021, 2022, 2023, 2024]
  live_research_probe_years: [2021, 2022, 2023, 2024, 2025]
  primary_representation: labor_productivity_index_2017_100
  public_api_series:
    "23": MPU0023062
    "31": MPU9900062
    "42": MPU0042062
    "44": MPU0044062
    "51": MPU0051062
    "52": MPU0052062
    "53": MPU0053062
    "54": MPU0054062
    "56": MPU0056062
    "61": MPU0061062
    "62": MPU0062062
    "71": MPU0071062
    "72": MPU0072062
    "81": MPU0081062
  crosswalk_version: bls-major-industry-naics2-v1
  archived_release_crosscheck:
    representation: annual_percent_change
    years: [2021, 2022, 2023, 2024]
    use_for_point_in_time_audit: true
  vintage_policy: current_api_snapshot_for_research_only; archived_release_required_for_historical_point_in_time

alignment:
  entity_rule: intersection_of_census_btos_naics2_and_bls_published_naics2
  minimum_entities: 4
  minimum_pre_periods: 2
  minimum_post_periods: 1
  post_start_year: 2024
  require_pre_and_post_for_every_entity: true
  duplicate_entity_period: reject
  missing_entity_period: do_not_impute
  incomplete_treatment_entity: exclude_with_explicit_diagnostic
  crosswalk_version_required: true

candidate_diagnostics:
  representation: labor_productivity_index_2017_100
  leave_one_sector_out: required
  pre_period_placebo:
    enabled: true
    years: [2021, 2022, 2023]
    pseudo_post_start_year: 2023
  placebo_threshold_frozen: false
  sector_pretrend:
    years: [2021, 2022, 2023]
    method: entity_linear_trend
    extrapolate_to_year: 2024
    require_equivalence_check:
      - 2024_residual_on_baseline_ai_intensity
      - twfe_with_entity_specific_linear_trends
    threshold_frozen: false
  single_post_year_warning: true
  candidate_is_authoritative_state_input: false

point_in_time:
  treatment_vintage_required: true
  productivity_vintage_required: true
  backtest_current_revised_bls_as_historical: forbidden

promotion:
  mode: fail_closed
  research_estimation_minimum_post_periods: 1
  minimum_post_periods_for_state_promotion: 2
  panel_validation_required: true
  full_rank_design_required: true
  treatment_regime_clean_required: true
  pretrend_confounding_resolution_required: true
  ex_post_diagnostic_threshold_tuning: forbidden
  beta_normalization_frozen: false
  point_in_time_vintages_complete: false
  prospective_validation_passed: false
  A_coverage_increment_until_all_gates_pass: 0.0

notes:
  - BTOS AI estimates are biweekly but APCR outcome is annual; treatment must be aggregated/frozen before joining.
  - The 2025-11 wording break must not be pooled into the baseline treatment series.
  - BLS Major Industry MPU series align with the frozen NAICS2 treatment universe; detailed-industry IPU series must not be substituted.
  - Public API index history is current revised snapshot data and cannot be backdated into historical decisions.
  - Archived annual releases are retained separately for point-in-time audit.
  - Beta is an interaction coefficient, not proof of causal AI productivity.
  - The current-snapshot candidate must report leave-one-sector-out and pre-period placebo diagnostics before any normalization discussion.
  - No placebo pass/fail threshold is frozen yet; the raw placebo/main ratio must be preserved.
  - Sector-specific 2021-2023 trends must be measured and extrapolated to 2024 before any APCR promotion discussion.
  - The residual-on-treatment and TWFE-with-entity-trends coefficients must agree numerically; disagreement is an implementation failure.
  - This contract intentionally keeps APCR missing in live A until normalization and prospective validation are frozen.

  - Research estimation with one post year does not satisfy the production promotion gate; at least two post outcome years are required.
  - D22C5 diagnostics are evidence about confounding, not inputs for an ex-post tuned pass threshold.
  - APCR promotion is fail-closed: any unresolved gate keeps authoritative_state_input false and A coverage increment at zero.

  - 2025 is probed as a second-post availability gate before the estimator is expanded; partial sector coverage is not sufficient.
