[project]
name = "global-regime-radar"
version = "0.1.0"
description = "Point-in-time global macro regime and stress research engine"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
