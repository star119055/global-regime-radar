name: Shadow Mode

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  shadow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Collect official public live evidence
        run: |
          mkdir -p shadow-artifacts
          python -m global_regime_radar.live.cli \
            --output shadow-artifacts/live-evidence.json \
            --lookback-days 180
      - name: Run point-in-time shadow contract
        run: |
          python -m global_regime_radar.shadow.cli \
            --input shadow-artifacts/live-evidence.json \
            --output-dir shadow-artifacts \
            --feature-set-version live-v1 \
            --config-hash shadow-v1
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-${{ github.run_id }}
          path: shadow-artifacts/
