name: APCR Source Probe

on:
  push:
    branches: [main]
    paths:
      - 'src/global_regime_radar/research/apcr_probe.py'
      - 'src/global_regime_radar/research/apcr_candidate.py'
      - 'src/global_regime_radar/research/apcr_promotion.py'
      - 'src/global_regime_radar/modules/apcr.py'
      - 'config/apcr_panel.yaml'
      - '.github/workflows/apcr_probe.yml'
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Probe official APCR source schemas
        run: |
          mkdir -p apcr-probe-artifacts
          python -m global_regime_radar.research.apcr_probe \
            --output apcr-probe-artifacts/apcr-source-probe.json
      - name: Summarize 2025 release gate
        run: |
          python -m global_regime_radar.research.apcr_watch \
            --input apcr-probe-artifacts/apcr-source-probe.json \
            --summary-output "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: apcr-source-probe-${{ github.run_id }}
          path: apcr-probe-artifacts/
